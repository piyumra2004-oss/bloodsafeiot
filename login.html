<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BloodSafe IoT - Login</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        /* ============================================================
           PROFESSIONAL LOGIN PAGE - CLEAN VERSION
           ============================================================ */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f0f4f8;
            background-image: 
                radial-gradient(ellipse at 10% 20%, rgba(102, 126, 234, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 90% 80%, rgba(118, 75, 162, 0.12) 0%, transparent 50%);
        }

        .login-wrapper {
            display: flex;
            width: 100%;
            max-width: 900px;
            min-height: 520px;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.12), 0 10px 30px rgba(0, 0, 0, 0.04);
            overflow: hidden;
            margin: 20px;
        }

        /* LEFT PANEL - Branding */
        .login-brand {
            flex: 1;
            padding: 50px 40px;
            background: linear-gradient(145deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            overflow: hidden;
            min-width: 280px;
        }

        .login-brand::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -30%;
            width: 400px;
            height: 400px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 50%;
        }

        .login-brand::after {
            content: '';
            position: absolute;
            bottom: -40%;
            left: -20%;
            width: 300px;
            height: 300px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 50%;
        }

        .brand-icon {
            font-size: 48px;
            margin-bottom: 16px;
            position: relative;
            z-index: 1;
        }

        .brand-title {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.5px;
            position: relative;
            z-index: 1;
        }

        .brand-subtitle {
            font-size: 16px;
            font-weight: 300;
            opacity: 0.85;
            margin-top: 6px;
            position: relative;
            z-index: 1;
        }

        .brand-divider {
            width: 50px;
            height: 3px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 2px;
            margin: 20px 0;
            position: relative;
            z-index: 1;
        }

        .brand-footer {
            margin-top: auto;
            font-size: 13px;
            opacity: 0.6;
            position: relative;
            z-index: 1;
            padding-top: 30px;
        }

        /* RIGHT PANEL - Login Form */
        .login-form-panel {
            flex: 1;
            padding: 50px 48px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: #ffffff;
            min-width: 300px;
        }

        .form-header {
            margin-bottom: 32px;
        }

        .form-header h2 {
            font-size: 24px;
            font-weight: 600;
            color: #1a1a2e;
            letter-spacing: -0.3px;
        }

        .form-header p {
            font-size: 14px;
            color: #8e8ea0;
            margin-top: 6px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #2d2d44;
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            font-size: 14px;
            font-family: inherit;
            border: 1.5px solid #e8ecf1;
            border-radius: 12px;
            background: #fafbfc;
            transition: all 0.25s ease;
            color: #1a1a2e;
            outline: none;
        }

        .form-group input:focus {
            border-color: #667eea;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.08);
        }

        .form-group input::placeholder {
            color: #b0b0c0;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            font-family: inherit;
            color: white;
            background: linear-gradient(145deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 8px;
            letter-spacing: 0.3px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(102, 126, 234, 0.35);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-error {
            display: none;
            background: #fef2f2;
            color: #dc2626;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 16px;
            border-left: 3px solid #dc2626;
            align-items: center;
            gap: 8px;
        }

        .login-error.show {
            display: flex;
        }

        .login-error::before {
            content: '✕';
            font-weight: 700;
            font-size: 14px;
        }

        .form-footer {
            margin-top: 24px;
            text-align: center;
            font-size: 13px;
            color: #8e8ea0;
        }

        /* RESPONSIVE */
        @media (max-width: 820px) {
            .login-wrapper {
                flex-direction: column;
                max-width: 400px;
                min-height: auto;
                border-radius: 20px;
                margin: 16px;
            }

            .login-brand {
                padding: 32px 28px;
                min-width: unset;
                min-height: 150px;
            }

            .login-form-panel {
                padding: 32px 28px;
                min-width: unset;
            }

            .brand-title {
                font-size: 26px;
            }

            .brand-footer {
                display: none;
            }
        }

        @media (max-width: 440px) {
            .login-wrapper {
                border-radius: 16px;
                margin: 12px;
            }

            .login-brand {
                padding: 24px 20px;
            }

            .login-form-panel {
                padding: 24px 20px;
            }

            .form-header h2 {
                font-size: 20px;
            }

            .form-group input {
                padding: 12px 14px;
                font-size: 13px;
            }

            .login-btn {
                padding: 12px;
                font-size: 15px;
            }
        }
    </style>
</head>
<body>

    <div class="login-wrapper">

        <!-- LEFT PANEL - Branding -->
        <div class="login-brand">
            <div class="brand-icon">🩸</div>
            <h1 class="brand-title">BloodSafe IoT</h1>
            <p class="brand-subtitle">Smart Blood Bank Monitoring</p>
            <div class="brand-divider"></div>
            <div class="brand-footer">
                Suwa Setha Hospital &bull; v2.0
            </div>
        </div>

        <!-- RIGHT PANEL - Login Form -->
        <div class="login-form-panel">

            <div class="form-header">
                <h2>Welcome Back</h2>
                <p>Sign in to access the blood bank dashboard</p>
            </div>

            <form id="loginForm">
                <div id="loginError" class="login-error">
                    Invalid username or password. Please try again.
                </div>

                <div class="form-group">
                    <label for="username">Username</label>
                    <input 
                        type="text" 
                        id="username" 
                        placeholder="Enter your username" 
                        required 
                        autocomplete="username"
                    />
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        placeholder="Enter your password" 
                        required 
                        autocomplete="current-password"
                    />
                </div>

                <button type="submit" class="login-btn">Sign In</button>
            </form>

            <div class="form-footer">
                Secure access for authorized personnel only
            </div>

        </div>

    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorBox = document.getElementById('loginError');

            const validUsers = {
                'officer1': 'pass123',
                'manager1': 'pass123'
            };

            if (validUsers[username] && validUsers[username] === password) {
                const role = username === 'manager1' ? 'MANAGER' : 'OFFICER';
                localStorage.setItem('user', JSON.stringify({
                    username: username,
                    role: role
                }));
                window.location.href = 'index.html';
            } else {
                errorBox.classList.add('show');
                errorBox.style.animation = 'shake 0.4s ease';
                setTimeout(() => {
                    errorBox.style.animation = '';
                }, 500);
            }
        });

        // Clear error on typing
        document.querySelectorAll('#loginForm input').forEach(input => {
            input.addEventListener('input', function() {
                document.getElementById('loginError').classList.remove('show');
            });
        });

        // Add shake animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                20% { transform: translateX(-10px); }
                40% { transform: translateX(10px); }
                60% { transform: translateX(-6px); }
                80% { transform: translateX(6px); }
            }
        `;
        document.head.appendChild(style);
    </script>

</body>
</html>
