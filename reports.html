<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BloodSafe IoT - Reports</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">🩸 BloodSafe IoT</div>
        <button class="hamburger" onclick="toggleMobileMenu()">☰</button>
        <div class="nav-links" id="navLinks">
            <a href="index.html">Dashboard</a>
            <a href="inventory.html">Inventory</a>
            <a href="alerts.html">Alerts</a>
            <a href="reports.html" class="active">Reports</a>
            <a href="settings.html">Settings</a>
            <span id="userDisplay" class="user-badge">👤 Manager</span>
            <button onclick="logout()" class="logout-btn">Logout</button>
        </div>
    </nav>
    <main class="dashboard">
        <h1>📊 Reports & Analytics</h1>

        <!-- Report Type Selection -->
        <div class="section">
            <h2>📋 Generate Report</h2>
            <div class="report-controls">
                <div class="form-group">
                    <label>Report Type:</label>
                    <select id="reportType">
                        <option value="inventory">📦 Inventory Report</option>
                        <option value="alerts">🔔 Alerts Report</option>
                        <option value="temperature">🌡️ Temperature Report</option>
                        <option value="wastage">🗑️ Wastage Analysis</option>
                        <option value="full">📊 Full System Report</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Date Range:</label>
                    <select id="dateRange">
                        <option value="today">Today</option>
                        <option value="week" selected>Last 7 Days</option>
                        <option value="month">Last 30 Days</option>
                        <option value="custom">Custom Range</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Export Format:</label>
                    <select id="exportFormat">
                        <option value="pdf">PDF</option>
                        <option value="excel">Excel (CSV)</option>
                        <option value="json">JSON</option>
                        <option value="html">HTML</option>
                    </select>
                </div>
                <button onclick="generateReport()" class="action-btn">📊 Generate Report</button>
                <button onclick="scheduleReport()" class="action-btn">⏰ Schedule</button>
            </div>
        </div>

        <!-- Report Preview -->
        <div class="section">
            <h2>📄 Report Preview</h2>
            <div id="reportPreview" class="report-preview">
                <p>Select a report type and click "Generate Report" to preview.</p>
            </div>
            <div class="action-buttons">
                <button onclick="exportReport('pdf')" class="action-btn" id="exportPdfBtn">📥 Export PDF</button>
                <button onclick="exportReport('excel')" class="action-btn" id="exportExcelBtn">📥 Export Excel</button>
                <button onclick="exportReport('json')" class="action-btn">📥 Export JSON</button>
                <button onclick="printReport()" class="action-btn">🖨️ Print</button>
            </div>
        </div>

        <!-- Scheduled Reports -->
        <div class="section">
            <h2>⏰ Scheduled Reports</h2>
            <div id="scheduledReportsList">
                <p>No scheduled reports configured.</p>
            </div>
            <button onclick="showScheduleModal()" class="action-btn">➕ Add Schedule</button>
        </div>
    </main>

    <!-- Schedule Modal -->
    <div id="scheduleModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:999; justify-content:center; align-items:center;">
        <div style="background:white; padding:30px; border-radius:12px; max-width:500px; width:90%;">
            <h2>⏰ Schedule Report</h2>
            <div class="form-group">
                <label>Report Type:</label>
                <select id="scheduleReportType">
                    <option value="inventory">Inventory Report</option>
                    <option value="alerts">Alerts Report</option>
                    <option value="temperature">Temperature Report</option>
                    <option value="wastage">Wastage Analysis</option>
                </select>
            </div>
            <div class="form-group">
                <label>Frequency:</label>
                <select id="scheduleFrequency">
                    <option value="daily">Daily</option>
                    <option value="weekly">Weekly</option>
                    <option value="monthly">Monthly</option>
                </select>
            </div>
            <div class="form-group">
                <label>Recipients (email):</label>
                <input type="email" id="scheduleRecipients" placeholder="manager@suwasetha.lk" multiple>
            </div>
            <div class="action-buttons">
                <button onclick="saveSchedule()" class="action-btn">💾 Save Schedule</button>
                <button onclick="closeScheduleModal()" class="action-btn danger">Cancel</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="script.js"></script>
    <script src="reports.js"></script>
</body>
</html>
